<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The renderer is a local bundle with no remote content. The CSP forbids
      network access and inline script outright, so a successful XSS has no
      exfiltration channel even if the bundle were compromised.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: moth-artwork:; font-src 'self'; connect-src 'self'"
    />
    <title>Moth Download Manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
